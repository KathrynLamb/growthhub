# deploy/apache-growthhub.conf
# Copy to /etc/apache2/sites-available/growthhub.conf, then:
#   sudo a2ensite growthhub && sudo systemctl reload apache2
# Certbot adds the :443 block and redirect when you run it (see DEPLOY.md).

<VirtualHost *:80>
    ServerName stories.flipwhizz.com

    Alias /static/ /srv/growthhub/app/staticfiles/
    <Directory /srv/growthhub/app/staticfiles>
        Require all granted
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    <Directory /srv/growthhub/app/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    WSGIDaemonProcess growthhub user=growthhub group=growthhub processes=2 threads=4 \
        python-home=/srv/growthhub/venv python-path=/srv/growthhub/app
    WSGIProcessGroup growthhub
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /srv/growthhub/app/config/wsgi.py

    ErrorLog ${APACHE_LOG_DIR}/growthhub-error.log
    CustomLog ${APACHE_LOG_DIR}/growthhub-access.log combined
</VirtualHost>
