# .github/workflows/retry-printables.yml
# Vercel's free plan only runs cron once a day, so this calls the protected
# /internal/cron/ URL every 15 minutes to retry any printable that failed.
# Needs two repo secrets: CRON_URL (e.g. https://growthhub.vercel.app/internal/cron/) and CRON_SECRET.
name: Retry printables

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-24.04
    steps:
      - name: Call the cron URL
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL or CRON_SECRET not set yet; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$CRON_URL"
